# Publishes the browser build on GitHub Pages: on every push to main, and by
# hand from the Actions tab, trunk builds the application for
# wasm32-unknown-unknown into dist/, and the Pages actions publish that
# folder as the site, https://jj136975.github.io/Emulator8086/.
#
# The site is served below the repository's name, so trunk is given the
# base path Pages reports as its public URL: every link trunk writes into
# the page starts with it, and a page built for `/` would load nothing. The
# repository's Settings > Pages must name "GitHub Actions" as the source of
# the site, or the build stops at configure-pages.
#
# The site publishes the BIOS beside the page, as rom/bios.bin, assembled
# here from its sources. nasm comes from Ubuntu's packages, and the sources
# are made newer than the image the checkout wrote with them: the core's
# build script (crates/emu8086_core/build.rs: nasm, then the checksum patch)
# then assembles the image again during the build that embeds it. The run
# fails if that image is not the one committed, which is then to be
# assembled again and committed with its sources.
#
# trunk is the version the project is built with by hand (CLAUDE.md, "Build
# & test"), downloaded from its releases and checked against the checksum
# below: a new version changes both.
#
# The site publishes two disks beside the page as well, which the emulator
# makes here: disks/msdos400.img, an MS-DOS 4.00 boot floppy, and
# disks/doom8088.img, a hard disk on which MS-DOS 4.00 starts Doom8088. The
# inputs are fetched, each checked against its pin; then the tool of
# crates/dos_images has FreeDOS build MS-DOS 4.00 from its source inside the
# emulator, makes the disks of what it built and boots each. That takes
# minutes, so its output is kept from run to run for as long as nothing it
# is made of changes. The run fails unless the files the build made are
# those listed in crates/dos_images/msdos400-binaries.sha256 and the disks
# those of crates/dos_images/disks.sha256: the same inputs make the same
# disks, byte for byte.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run queued behind another replaces any queued
# before it; the run in progress is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: 0.21.14
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: nasm
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm

      # A checkout dates every file alike: the build script would take the
      # image for up to date.
      - name: BIOS sources newer than the image
        run: touch assets/rom/*.asm assets/rom/*.inc

      # The toolchain `rust-toolchain` pins, with the wasm32 target it lists.
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: trunk
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" \
            "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$TRUNK_SHA256  $RUNNER_TEMP/trunk.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The crates and what was built of them, kept for as long as the
      # toolchain and the manifests stay the same.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: pages-${{ runner.os }}-${{ hashFiles('rust-toolchain', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: pages-${{ runner.os }}-

      - name: Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: trunk build --release --public-url "$PUBLIC_URL"
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}/

      # The image is newer than its sources again only if this run assembled
      # it. trunk copies it into dist/ (index.html) while the build runs,
      # before or after the build script replaced it: what is published is
      # compared with what was assembled, and that with what is committed.
      - name: BIOS
        run: |
          for source in assets/rom/*.asm assets/rom/*.inc; do
            if ! [ assets/rom/bios.bin -nt "$source" ]; then
              echo "::error::assets/rom/bios.bin was not assembled in this run: $source is newer"
              exit 1
            fi
          done
          if ! git diff --exit-code --stat assets/rom/bios.bin; then
            echo "::error::assets/rom/bios.bin is not what its sources assemble to: assemble it again and commit it"
            exit 1
          fi
          cmp assets/rom/bios.bin dist/rom/bios.bin

      # The output of crates/dos_images, from an earlier run whose inputs
      # were the same: the pins of what it fetches, the tool, the machine,
      # the BIOS the machine runs, the manifests and the locked crates, and
      # the toolchain. Any of them may change what the build makes.
      - name: MS-DOS disks of an earlier run
        id: dos-disks
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dos-images
          key: dos-images-${{ runner.os }}-${{ hashFiles('crates/dos_images/pins.env', 'crates/dos_images/**', 'crates/emu8086_core/**', 'assets/rom/bios.bin', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain') }}

      # The inputs, each checked against its pin: FreeDOS 1.4's boot floppy,
      # the build host, which is not published; the restored source of
      # MS-DOS 4.00; and Doom8088's release, with its GPL text.
      - name: MS-DOS build inputs
        if: steps.dos-disks.outputs.cache-hit != 'true'
        run: bash crates/dos_images/fetch-inputs.sh "$RUNNER_TEMP/dos-inputs"

      # FreeDOS builds MS-DOS 4.00 inside the emulator, with the tools that
      # come with its source; the tool makes the two disks of what it built
      # and boots each. It says which stage failed, and how, as an error of
      # the run.
      - name: MS-DOS build
        if: steps.dos-disks.outputs.cache-hit != 'true'
        run: |
          cargo run --release -p dos_images -- \
            --freedos "$RUNNER_TEMP/dos-inputs/freedos" \
            --msdos "$RUNNER_TEMP/dos-inputs/msdos/v4.0" \
            --doom8088 "$RUNNER_TEMP/dos-inputs/doom8088" \
            --out "$RUNNER_TEMP/dos-images"

      # Checked on every run, one that took them from the cache too: 61 of
      # the files the build made are those of MS-DOS 4.00's release of 1988
      # and the 62nd, XMAEM.SYS, is the one built before; the disks the site
      # publishes are the ones pinned. The tool's report is the run's
      # summary.
      - name: MS-DOS disks
        env:
          OUT: ${{ runner.temp }}/dos-images
          CACHED: ${{ steps.dos-disks.outputs.cache-hit }}
        run: |
          (cd "$OUT/bin" && sha256sum --check --strict --quiet "$GITHUB_WORKSPACE/crates/dos_images/msdos400-binaries.sha256")
          mkdir -p dist/disks
          cp "$OUT/disks/msdos400.img" dist/disks/msdos400.img
          cp "$OUT/disks/doom8088.img" dist/disks/doom8088.img
          (cd dist/disks && sha256sum --check --strict "$GITHUB_WORKSPACE/crates/dos_images/disks.sha256")
          {
            if [ "$CACHED" = true ]; then
              echo "### MS-DOS disks, as an earlier run made them"
            else
              echo "### MS-DOS disks"
            fi
            echo '```'
            cat "$OUT/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
