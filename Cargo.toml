[package]
name = "emulator_8086"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
emu8086_core.workspace = true

log.workspace = true
# The clocks of both hosts under one name (src/platform): std's on a
# desktop, the page's `performance.now()` and `Date` in a browser, where
# the clocks of std panic.
web-time.workspace = true

# The window: winit opens it and delivers the keys, wgpu draws into it.
wgpu.workspace = true
winit.workspace = true
bytemuck.workspace = true

# The overlay: egui lays the tools out and egui-wgpu draws its meshes over
# the emulator's frame. Of their features only egui's built-in fonts are
# taken, without which it has no text: the system clipboard, the
# screen-reader adapters and the opening of links have no counterpart in a
# browser, where the overlay runs too.
egui = { workspace = true, features = ["default_fonts"] }
egui-wgpu.workspace = true

# The host's file dialogs, for the disk tools (src/platform): those of the
# desktop's system, and in a browser the page's file picker.
rfd.workspace = true

# What only a desktop has (src/platform/native.rs): a command line, a
# stderr to log to, a thread that may block on the GPU's start-up.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
env_logger.workspace = true
pollster.workspace = true
# The window's events as egui's input. egui-winit 0.36.2 does not build for
# wasm32 (it implements `egui::DroppedFile::bytes`, which egui declares only
# off wasm32): in a browser the app translates the events itself
# (src/platform/egui_events.rs).
egui-winit.workspace = true
# The app is the machine's wall clock (src/wall_clock.rs). The local time
# files on a FAT volume are stamped with comes from fatfs's own time
# provider, which is there only with `chrono`: the app turns the feature
# on, and the core, which reads no clock, lists fatfs without it.
fatfs = { workspace = true, features = ["chrono"] }

# What only a browser has (src/platform/web.rs): the page, reached through
# wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Without `chrono`: there the wall clock is the page's `Date`.
fatfs.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Node",
    "Url",
    "Window",
    "console",
] }
# WebGPU is among wgpu's default features. WebGL2 is what a browser without
# WebGPU is drawn with.
wgpu = { workspace = true, features = ["webgl"] }

[lints]
workspace = true

[workspace]
members = ["crates/emu8086_core"]

[workspace.package]
edition = "2024"
license = "MIT"

# Version authority for the whole workspace: bump dependencies HERE, once.
# Members add their own feature selections on top (features are additive).
[workspace.dependencies]
clap = { version = "4.5.58", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.9"
# Without fatfs's "alloc" feature no VFAT long-name entries are written:
# MS-DOS 6 shows such an entry as the volume label of a disk that has none.
# Without "chrono" fatfs has no clock of its own: the app adds that feature.
fatfs = { version = "0.3", default-features = false, features = ["std"] }
wgpu = "30"
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# The three egui crates move together: egui-wgpu names the wgpu version and
# egui-winit the winit version they are built for (wgpu 30, winit 0.30.13).
egui = { version = "0.36", default-features = false }
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
# With its default features, which only Linux and the BSDs have a use for:
# the dialogs of the desktop portal, parented to a Wayland window as well.
rfd = "0.17"
web-time = "1.1.0"
# The browser build (wasm32-unknown-unknown). The four of wasm-bindgen move
# together, and trunk fetches the wasm-bindgen CLI of the version that is
# locked for the first.
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"
# Dev-only: the hardware-captured CPU vectors (the `8086` submodule) are
# gzipped JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

# Internal crates
emu8086_core = { path = "crates/emu8086_core" }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# line-tables-only: fast compiles/links; backtraces (function names +
# file:line) keep working — only debugger variable inspection gets thinner.
[profile.dev]
debug = "line-tables-only"

# Fat LTO is worth 4-10 % of interpreter speed (measured on synthetic guest
# loops and on DOOM's timedemo) for a longer release link.
[profile.release]
lto = "fat"
