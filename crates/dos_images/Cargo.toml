[package]
name = "dos_images"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The tool that builds MS-DOS 4.00 from its source inside the emulator and
# makes the site's two disks of what it built. The machine, and fatfs as the
# core takes it, without `chrono`: the tool stamps what it writes with fixed
# times, so that it makes the same disks on every run.
[dependencies]
emu8086_core.workspace = true
fatfs.workspace = true

[lints]
workspace = true
